[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qfbench2-track-coding"
version = "3.1.0"
description = "QFBench 2.0 Track 1 verifier, scorer, and coding agent. Scoring math lives in qfbench2-common."
requires-python = ">=3.13"
# The scoring path SHELLS OUT. `qfbench2_track_coding.scoring._run_trusted_checks` runs each
# unit's grader-owned `checks/test_outputs.py` with `{sys.executable} -m pytest`, so the scoring
# environment must be able to import what those checks import. Until 2026-08-29 this list was
# `qfbench2-common` alone, and `qfbench2-common` carries pytest only in its `dev` extra.
# Measured in a clean venv holding exactly the old list, on a real unit with a genuinely correct
# submission: `python -m pytest` exited 1 ("No module named pytest") -- the same exit code as
# "tests failed" -- so the attempt was scored 0 and labelled `t1.wrong_numeric`. Every Track 1
# submission would have failed that way, and every one would have been blamed for it.
#
# Measured over all 87 public units (`pytest --collect-only`, 2026-08-29): 87 need pytest,
# 44 need pandas, 1 needs scikit-learn. numpy and scipy arrive transitively from
# qfbench2-common (numpy>=1.26, scipy>=1.11) and are not repeated here. Floors match
# `docker/requirements-sandbox.txt`, which is what the checks were authored against.
dependencies = [
  "qfbench2-common>=2.3.0,<3",
  "pytest>=8.2",
  "pandas>=2.1",
  # pandas does not read .parquet without an engine, and FOUR units' checks do exactly that --
  # t1-EXAMPLE-bs-greeks-pde, t1-double-sort, t1-residual-momentum, t1-stable-residual (measured;
  # SUBMISSION_CLI.md says the same). Omitting it reproduces the pytest-shaped failure this
  # comment block already records: an import error inside the checks, scored as a wrong answer.
  "pyarrow>=15",
  "scikit-learn>=1.4",
  "openai>=3.19.2",
  "python-dotenv>=1.0,<2",
  "typer>=0.12,<1",
  "torch==2.13.0",
  "torchaudio==2.11.0",
  "torchvision==0.28.0",
  "vllm>=0.30.0",
  "pyflakes>=4.0.0",
]

[project.scripts]
qfbench-agent = "agent.main:main"

[tool.setuptools]
packages = ["qfbench2_track_coding", "agent"]

[tool.uv.sources]
qfbench2-common = { git = "https://github.com/Agenthon-2026/Agenthon2026-public.git", tag = "v2.4.3", subdirectory = "common" }
torch = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[dependency-groups]
dev = [
  "ruff>=0.16.9",
  "ty>=0.0.84",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["agent", "qfbench2_track_coding", "examples", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["agent", "examples", "qfbench2_track_coding"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ty.environment]
root = ["."]
